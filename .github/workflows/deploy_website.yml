# Website deployen — auch vom iPad
# ================================
# Liegt bewusst im OEFFENTLICHEN Repo tv-rheinzabern-auto: nur dort sind die
# Actions-Minuten unbegrenzt. Die Website-Repos sind privat und koennen bis zum
# 1. September nicht selbst deployen (Monatskontingent aufgebraucht).
#
# SO BENUTZT DU IHN (iPad, Handy, PC):
#   Actions -> "Website deployen" -> "Run workflow"
#   -> Website waehlen -> starten
#
# Der Workflow prueft VOR dem Deploy, ob es Branches mit Arbeit gibt, die nicht in
# main steckt, und bricht dann ab. Grund: Am 25.08.2026 lief ein Deploy
# "erfolgreich" durch und lud trotzdem den alten Stand hoch, weil die fertigen
# Aenderungen auf einem Feature-Branch lagen und nie gemerged wurden. Ein stiller
# Fehlschlag ist schlimmer als ein lauter.
#
# SICHERHEIT: Laeuft nur auf ausdrueckliches Ausloesen, nie automatisch. Uebertraegt
# ausschliesslich, was die Erlaubnisliste im deploy.py des Repos zulaesst -
# config.php, Datenbanken und hochgeladene Dateien sind dort ausgeschlossen.

name: Website deployen

on:
  workflow_dispatch:
    inputs:
      website:
        description: "Welche Website?"
        type: choice
        required: true
        options:
          - tv-belege
          - tv-spiele
          - tv-wogele2026
          - tv-trainerportal
          - familie-website
      branch:
        description: "Branch (leer = main)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Nur auflisten, nichts hochladen"
        type: boolean
        required: true
        default: false
      trotzdem:
        description: "Auch deployen, wenn ungemergte Branches existieren"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ziel bestimmen
        id: ziel
        run: |
          case "${{ inputs.website }}" in
            tv-belege)        P=/belege ;;
            tv-spiele)        P=/spiele ;;
            tv-wogele2026)    P=/wogele2026 ;;
            tv-trainerportal) P=/ ;;
            familie-website)  P=/familievlklv56j1b ;;
            *) echo "Unbekannte Website"; exit 1 ;;
          esac
          B="${{ inputs.branch }}"; [ -z "$B" ] && B=main
          echo "pfad=$P" >> $GITHUB_OUTPUT
          echo "branch=$B" >> $GITHUB_OUTPUT
          echo "### Ziel" >> $GITHUB_STEP_SUMMARY
          echo "- Website: **${{ inputs.website }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: **$B**" >> $GITHUB_STEP_SUMMARY
          echo "- Serverordner: \`$P\`" >> $GITHUB_STEP_SUMMARY

      - name: Website-Repo holen
        uses: actions/checkout@v4
        with:
          repository: turntrainernoah-dot/${{ inputs.website }}
          ref: ${{ steps.ziel.outputs.branch }}
          token: ${{ secrets.REPO_READ_TOKEN }}
          fetch-depth: 0
          path: site

      - name: Liegt fertige Arbeit auf einem anderen Branch?
        working-directory: site
        run: |
          ZIEL="${{ steps.ziel.outputs.branch }}"
          OFFEN=""
          for b in $(git branch -r | grep -v HEAD | sed 's|origin/||' | tr -d ' '); do
            [ "$b" = "$ZIEL" ] && continue
            N=$(git rev-list --count "origin/$ZIEL..origin/$b" 2>/dev/null || echo 0)
            if [ "$N" -gt 0 ]; then
              LETZTE=$(git log -1 --format='%s' "origin/$b")
              OFFEN="$OFFEN\n- **$b**: $N Commit(s) nicht in $ZIEL — zuletzt: _${LETZTE}_"
            fi
          done
          if [ -n "$OFFEN" ]; then
            echo "### ⚠️ Ungemergte Arbeit gefunden" >> $GITHUB_STEP_SUMMARY
            echo -e "$OFFEN" >> $GITHUB_STEP_SUMMARY
            echo -e "\nDiese Aenderungen wuerden **nicht** mit hochgeladen." >> $GITHUB_STEP_SUMMARY
            echo -e "$OFFEN"
            if [ "${{ inputs.trotzdem }}" != "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Abgebrochen.** Entweder den Branch nach $ZIEL mergen, oder den Workflow erneut starten — entweder mit diesem Branch als Ziel, oder mit \"Auch deployen, wenn ungemergte Branches existieren\" = true." >> $GITHUB_STEP_SUMMARY
              echo "ABBRUCH: ungemergte Arbeit vorhanden. Siehe Zusammenfassung."
              exit 1
            fi
            echo "Hinweis uebersprungen (trotzdem=true), fahre fort."
          else
            echo "### ✅ Keine ungemergte Arbeit" >> $GITHUB_STEP_SUMMARY
            echo "Alle Branches sind in $ZIEL enthalten." >> $GITHUB_STEP_SUMMARY
          fi
          echo "Deployt wird Commit: $(git log -1 --format='%h %s')" | tee -a $GITHUB_STEP_SUMMARY

      - name: Python einrichten
        uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: paramiko installieren
        run: pip install --quiet paramiko

      - name: Was wuerde uebertragen? (Trockenlauf)
        working-directory: site
        env:
          DRY_RUN: "true"
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ steps.ziel.outputs.pfad }}
        run: |
          if [ ! -f .github/scripts/deploy.py ]; then
            echo "FEHLER: ${{ inputs.website }} hat kein .github/scripts/deploy.py"; exit 1
          fi
          python .github/scripts/deploy.py | tee /tmp/dry.txt
          echo "### Dateien" >> $GITHUB_STEP_SUMMARY
          echo "$(grep -c '^  ' /tmp/dry.txt) Datei(en) wuerden uebertragen." >> $GITHUB_STEP_SUMMARY
          if grep -qiE '\.sqlite|config\.php' /tmp/dry.txt; then
            echo "**ABBRUCH: Datenbank oder config.php in der Liste!**" >> $GITHUB_STEP_SUMMARY
            echo "ABBRUCH: unerwartete Datei in der Erlaubnisliste"; exit 1
          fi

      - name: Hochladen
        if: ${{ !inputs.dry_run }}
        working-directory: site
        env:
          DRY_RUN: "false"
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ steps.ziel.outputs.pfad }}
        run: |
          python .github/scripts/deploy.py
          echo "### ✅ Hochgeladen" >> $GITHUB_STEP_SUMMARY

      - name: Nur Trockenlauf
        if: ${{ inputs.dry_run }}
        run: echo "### Trockenlauf — es wurde nichts uebertragen" >> $GITHUB_STEP_SUMMARY
