name: Taegliches State-Backup
# Phase 2 (24.08.2026): sichert nicht mehr ins oeffentliche Repo, sondern per
# SFTP in den geschuetzten Server-Ordner config/_state_backups/<datum>/ (siehe
# backup_state.py). Deshalb "contents: read" statt "write" und kein
# Commit/Push-Schritt mehr -- das Repo waechst dadurch nicht mehr taeglich um
# echte Kindernamen/Anwesenheiten/Trainer-Einteilungen.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko
      - name: State vom Webspace laden und geschuetzt zurueckschreiben
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: python backup_state.py
