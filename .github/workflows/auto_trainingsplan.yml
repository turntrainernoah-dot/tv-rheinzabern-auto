name: Automatischer Trainingsplan

on:
  schedule:
    # Alle 4 Stunden (UTC) = 2:00 / 6:00 / 10:00 / 14:00 / 18:00 / 22:00 Uhr UTC
    # = 4:00 / 8:00 / 12:00 / 16:00 / 20:00 / 24:00 Uhr DE (Sommerzeit)
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:   # Manueller Start über GitHub jederzeit möglich

jobs:
  generate-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python-Pakete installieren
        run: pip install -r requirements.txt

      - name: LibreOffice installieren (für PDF-Export)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice --no-install-recommends

      - name: Trainingsplan generieren
        env:
          SSH_HOST:          ${{ secrets.SSH_HOST }}
          SSH_USER:          ${{ secrets.SSH_USER }}
          SSH_PASSWORD:      ${{ secrets.SSH_PASSWORD }}
          SSH_PORT:          ${{ secrets.SSH_PORT }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
        run: python auto_trainingsplan.py
