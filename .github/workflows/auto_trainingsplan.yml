name: Automatischer Trainingsplan

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 14 * * 3,5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerierung erzwingen, auch ohne geaenderte Abwesenheiten/Anmerkungen (z.B. nach einem reinen Code-Fix an der Zuteilungslogik)'
        required: false
        default: false
        type: boolean
      add_entfall_date:
        description: 'Notausweg: ein Datum (YYYY-MM-DD) manuell zu trainingsentfall.json hinzufuegen, falls ein Training abgesagt wurde, ohne dass der Website-Weg genutzt wurde. Leer lassen im Normalfall (Website ist die eigentliche Pflegeoberflaeche).'
        required: false
        default: ''
        type: string

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-Cache laden
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-paramiko-${{ runner.os }}-v1
          restore-keys: pip-paramiko-${{ runner.os }}-
      - name: paramiko installieren
        run: pip install paramiko>=3.0
      - name: Schnell-Check
        id: quickcheck
        env:
          SSH_HOST:     ${{ secrets.SSH_HOST }}
          SSH_USER:     ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT:     ${{ secrets.SSH_PORT }}
          FORCE_REGEN:  ${{ inputs.force || (inputs.add_entfall_date != '') }}
        run: python check_quick.py
      - name: openpyxl installieren
        if: steps.quickcheck.outputs.needs_update == 'true'
        run: pip install openpyxl>=3.1
      - name: LibreOffice installieren
        if: steps.quickcheck.outputs.needs_update == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice --no-install-recommends
      - name: Trainingsplan generieren / aktualisieren
        if: steps.quickcheck.outputs.needs_update == 'true'
        env:
          SSH_HOST:           ${{ secrets.SSH_HOST }}
          SSH_USER:           ${{ secrets.SSH_USER }}
          SSH_PASSWORD:       ${{ secrets.SSH_PASSWORD }}
          SSH_PORT:           ${{ secrets.SSH_PORT }}
          WHATSAPP_PHONE:     ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY:   ${{ secrets.CALLMEBOT_APIKEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          GH_MODELS_TOKEN:    ${{ secrets.GH_MODELS_TOKEN }}
          FORCE_REGEN:        ${{ inputs.force || (inputs.add_entfall_date != '') }}
          ADD_ENTFALL_DATE:   ${{ inputs.add_entfall_date }}
        run: python auto_trainingsplan.py
