name: Automatischer Trainingsplan

on:
  # Seit 05.11.2026: Start bei Aenderung statt alle 30 Minuten. Die Website
  # (index.php/admin.php) stoesst den Lauf per repository_dispatch an, sobald
  # Abmeldungen, Trainingsentfall, Anmerkungen, Gruppen oder der Plan-Editor
  # gespeichert werden. Die festen Zeiten unten sind nur noch Sicherheitsnetz
  # bzw. fuer die zeitabhaengigen Schritte (Erstellungsfenster 5 Tage vorher,
  # Veroeffentlichung Mi/Fr abends, Wechsel auf den naechsten Trainingstag).
  repository_dispatch:
    types: [trainingsplan]
  schedule:
    - cron: '7 4,10,16 * * *'        # taeglich 3x Sicherheitsnetz
    - cron: '0 14 * * 3,5'           # Trainingstag Nachmittag
    - cron: '20 12,13,15,16 * * 3,5' # Trainingstag stuendlich bis Trainingsbeginn
    - cron: '12 20,22 * * 3,5'       # Veroeffentlichungsfenster (>= 20:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerierung erzwingen, auch ohne geaenderte Abwesenheiten/Anmerkungen (z.B. nach einem reinen Code-Fix an der Zuteilungslogik)'
        required: false
        default: false
        type: boolean
      add_entfall_date:
        description: 'Notausweg: ein Datum (YYYY-MM-DD) manuell zu trainingsentfall.json hinzufuegen, falls ein Training abgesagt wurde, ohne dass der Website-Weg genutzt wurde. Leer lassen im Normalfall (Website ist die eigentliche Pflegeoberflaeche).'
        required: false
        default: ''
        type: string
      geraete:
        description: 'Einmalig die Geraete fuers aktuelle Training festlegen, z.B. "Sprung+Reck" oder "Boden+Barren" ("Seitpferd+Ringe" nur freitags). Leer = normale Rotation.'
        required: false
        default: ''
        type: string
      debug_dump:
        description: 'Nur Diagnose: gibt Roster/Abwesenheiten/Rollen-Historie und das Ergebnis der Trainer-Zuteilung fuer das naechste Training im Log aus, OHNE etwas hochzuladen oder zu speichern.'
        required: false
        default: false
        type: boolean

# Mehrere Anstoesse kurz hintereinander: hoechstens ein Lauf aktiv + einer
# wartend (neuere Wartende ersetzen aeltere), nie zwei parallel.
concurrency:
  group: trainingsplan
  cancel-in-progress: false

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-Cache laden
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-paramiko-${{ runner.os }}-v1
          restore-keys: pip-paramiko-${{ runner.os }}-
      - name: paramiko installieren
        run: pip install paramiko>=3.0
      - name: Schnell-Check
        id: quickcheck
        env:
          SSH_HOST:     ${{ secrets.SSH_HOST }}
          SSH_USER:     ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT:     ${{ secrets.SSH_PORT }}
          FORCE_REGEN:  ${{ inputs.force || (inputs.add_entfall_date != '') || (inputs.geraete != '') || inputs.debug_dump }}
        run: python check_quick.py
      - name: openpyxl installieren
        if: steps.quickcheck.outputs.needs_update == 'true'
        run: pip install openpyxl>=3.1
      - name: LibreOffice installieren
        if: steps.quickcheck.outputs.needs_update == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice --no-install-recommends
      - name: Trainingsplan generieren / aktualisieren
        if: steps.quickcheck.outputs.needs_update == 'true'
        env:
          SSH_HOST:           ${{ secrets.SSH_HOST }}
          SSH_USER:           ${{ secrets.SSH_USER }}
          SSH_PASSWORD:       ${{ secrets.SSH_PASSWORD }}
          SSH_PORT:           ${{ secrets.SSH_PORT }}
          GH_MODELS_TOKEN:    ${{ secrets.GH_MODELS_TOKEN }}
          FORCE_REGEN:        ${{ inputs.force || (inputs.add_entfall_date != '') || (inputs.geraete != '') || inputs.debug_dump }}
          ADD_ENTFALL_DATE:   ${{ inputs.add_entfall_date }}
          GERAETE_OVERRIDE:   ${{ inputs.geraete }}
          DEBUG_DUMP:         ${{ inputs.debug_dump }}
        run: python auto_trainingsplan.py
