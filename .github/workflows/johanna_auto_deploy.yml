# Johanna-Website automatisch deployen (/johanna)
# Alle 5 Minuten: Hat johanna-website (main) einen neuen Stand, wird public/ hochgeladen.
# Der zuletzt deployte Commit steht auf dem Server in /johanna/.deployed_sha.
#
# SICHERHEIT: Das Deploy-Skript liegt in DIESEM Repo (scripts/deploy_johanna.py), nicht im
# Repo johanna-website. Aus johanna-website werden nur Dateien als Daten gelesen, es wird
# dort nichts ausgefuehrt. So kann Johanna (bzw. Claude Code) die Server-Zugangsdaten nicht
# ueber ein manipuliertes Skript abgreifen. Nutzt REPO_READ_TOKEN (muss johanna-website
# lesen duerfen) und SSH_*. Oeffentliches Repo = 0 Minuten Kosten.
name: Johanna automatisch deployen

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: johanna-auto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Deploy-Skript holen (vertrauenswuerdig)
        uses: actions/checkout@v4
        with:
          path: trusted
      - name: Johanna-Repo holen (nur Daten)
        uses: actions/checkout@v4
        with:
          repository: turntrainernoah-dot/johanna-website
          ref: main
          token: ${{ secrets.REPO_READ_TOKEN }}
          path: site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install --quiet paramiko
      - name: Neuer Stand?
        id: check
        run: |
          SHA=$(git -C site rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          python - <<'PY' > /tmp/remote_sha.txt
          import os, paramiko
          t = paramiko.Transport((os.environ["SSH_HOST"], int(os.environ.get("SSH_PORT") or 22)))
          t.connect(username=os.environ["SSH_USER"], password=os.environ["SSH_PASSWORD"])
          s = paramiko.SFTPClient.from_transport(t)
          try:
              print(s.open("/johanna/.deployed_sha").read().decode().strip())
          except Exception:
              print("")
          t.close()
          PY
          if [ "$(cat /tmp/remote_sha.txt)" = "$SHA" ]; then
            echo "Schon aktuell ($SHA)"; echo "neu=false" >> $GITHUB_OUTPUT
          else
            echo "Neuer Stand: $SHA"; echo "neu=true" >> $GITHUB_OUTPUT
          fi
      - name: Hochladen
        if: steps.check.outputs.neu == 'true'
        env:
          DRY_RUN: "false"
        run: python trusted/scripts/deploy_johanna.py site
      - name: Stand merken und Seite pruefen
        if: steps.check.outputs.neu == 'true'
        run: |
          python - <<'PY'
          import os, io, paramiko
          t = paramiko.Transport((os.environ["SSH_HOST"], int(os.environ.get("SSH_PORT") or 22)))
          t.connect(username=os.environ["SSH_USER"], password=os.environ["SSH_PASSWORD"])
          s = paramiko.SFTPClient.from_transport(t)
          s.putfo(io.BytesIO("${{ steps.check.outputs.sha }}".encode()), "/johanna/.deployed_sha")
          t.close()
          PY
          code=$(curl -s -o /dev/null -w "%{http_code}" -L https://tv-rheinzabern.e-websolutions.de/johanna/)
          echo "HTTP $code"; [ "$code" = "200" ]
